[env:flowbutton]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D USERMOD_FLOWBUTTON
  -D BTNPIN=33,-1
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_NONE

[env:smoothbutton]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D USERMOD_FLOWBUTTON
  -D FLOWBUTTON_NO_WIPE
  -D BTNPIN=33,-1
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_NONE

[env:touchbutton]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D USERMOD_TOUCHBUTTON
  -D BTNPIN=33,-1
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_NONE
